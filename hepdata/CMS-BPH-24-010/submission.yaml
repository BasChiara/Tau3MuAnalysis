comment: A search for the lepton-flavor-violating decay of a tau lepton into three
  muons ($\tau^-\to\mu^-\mu^+\mu^-$) in proton-proton collisions at a center-of-mass
  energy of 13.6 TeV is presented using data collected by the CMS experiment in 2022
  and 2023, with dedicated triggers providing an integrated luminosity of up to 63
  $\mathrm{fb}^{-1}$. Tau leptons originating from heavy-flavor hadron decays, $W$
  boson decays, and, for the first time, $Z$ boson decays are considered. No significant
  excess over background is observed. The observed (expected) upper limit on the branching
  fraction $\mathcal{B}(\tau^-\to\mu^-\mu^+\mu^-)$ at 90% confidence level is 6.7
  (4.7)$\times 10^{-8}$. The results are also combined with those obtained by the
  CMS experiment at a center-of-mass energy of 13 TeV, using data recorded in 2016--2018,
  corresponding to an integrated luminosity of up to 131 $\mathrm{fb}^{-1}$. The combination
  results in an observed (expected) upper limit of 2.8 (2.2)$\times 10^{-8}$ at 90%
  confidence level.
